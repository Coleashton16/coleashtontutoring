<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Admin | Ashton Nursing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Plus Jakarta Sans', sans-serif; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #f1f5f9; padding: 14px; text-align: left; }
        th { background-color: #f8fafc; font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; font-weight: 700; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-box { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .day-box.blackout { background-color: #fee2e2; color: #ef4444; border-color: #fecaca; text-decoration: line-through; }
        .day-box:hover:not(.empty) { background-color: #f1f5f9; }
        .status-badge { padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; letter-spacing: 0.02em; }
        .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; transition: all 0.2s; border-width: 1px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Login Section -->
    <div id="loginSection" class="max-w-sm mx-auto mt-32 bg-white p-8 rounded-[2rem] shadow-2xl border border-slate-100">
        <div class="flex flex-col items-center mb-8">
            <div class="bg-indigo-600 p-4 rounded-2xl mb-4 shadow-lg shadow-indigo-200">
                <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold brand-font text-slate-900">Admin Portal</h1>
            <p class="text-sm text-slate-500">Cole Ashton Tutoring Management</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="admin@admin.com" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <input type="password" id="password" placeholder="••••••••" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition" onkeydown="if(event.key === 'Enter') login()">
            <button onclick="login()" id="loginBtn" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold hover:bg-black transition shadow-lg">Sign In</button>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden">
        <nav class="bg-slate-900 text-white px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-1.5 rounded-lg"><i data-lucide="layout-dashboard" class="text-white w-4 h-4"></i></div>
                <h1 class="font-bold tracking-tight brand-font">Tutor Management</h1>
            </div>
            <div class="flex items-center gap-8 text-sm font-semibold">
                <button onclick="scrollToSection('scheduleSection')" class="text-slate-400 hover:text-white transition">Availability</button>
                <button onclick="scrollToSection('bookingsSection')" class="text-slate-400 hover:text-white transition">Appointments</button>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 transition">Log Out</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-6 md:p-10 space-y-12">
            
            <section id="scheduleSection" class="grid lg:grid-cols-3 gap-8">
                <!-- Weekly Recurring -->
                <div class="lg:col-span-2 bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-8 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="text-xl font-bold brand-font">Weekly Recurring Availability</h2>
                        <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-bold uppercase">Pro-tip: Press Enter to Add</span>
                    </div>
                    <div class="p-8 space-y-4" id="weeklyScheduleContainer"></div>
                </div>

                <!-- Blackout Calendar -->
                <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-8 border-b border-slate-100">
                        <h2 class="text-xl font-bold brand-font text-red-600">Blackout Dates</h2>
                        <p class="text-xs text-slate-500 mt-1 text-slate-400">Tap a date to block it entirely.</p>
                    </div>
                    <div class="p-8">
                        <div class="flex items-center justify-between mb-4">
                            <h3 id="adminCalMonth" class="font-bold text-slate-900 text-sm">Month</h3>
                            <div class="flex gap-1">
                                <button onclick="changeAdminCal(-1)" class="p-1 hover:bg-slate-100 rounded transition"><i data-lucide="chevron-left" class="w-4 h-4 text-slate-400"></i></button>
                                <button onclick="changeAdminCal(1)" class="p-1 hover:bg-slate-100 rounded transition"><i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i></button>
                            </div>
                        </div>
                        <div id="adminCalGrid" class="calendar-grid"></div>
                    </div>
                </div>
            </section>

            <!-- Bookings List -->
            <section id="bookingsSection" class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-8 border-b border-slate-100"><h2 class="text-xl font-bold brand-font text-slate-900">Appointment Requests</h2></div>
                <div class="overflow-x-auto">
                    <table id="requestsTable">
                        <thead>
                            <tr>
                                <th>Date/Time</th>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDRLarhK20JltsckgrZRVJBDt4A4FTkUSk", authDomain: "coleashtontut.firebaseapp.com", projectId: "coleashtontut", storageBucket: "coleashtontut.firebasestorage.app", messagingSenderId: "277509432126", appId: "1:277509432126:web:08c3221cbf3d1336a3c26f" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "coleashtontut";
        const ADMIN_EMAIL = "admin@admin.com";

        let currentWeeklySchedule = {}; 
        let currentBlackouts = []; 
        let adminCalMonth = new Date().getMonth();
        let adminCalYear = new Date().getFullYear();

        lucide.createIcons();

        // Standardize time inputs (14:00 -> 02:00 PM, 10am -> 10:00 AM)
        function standardizeTime(input) {
            let res = input.trim().toLowerCase().replace(/\./g, '').replace(/\s/g, '');
            if (!res) return null;

            // Handle "1400" or "0900"
            if (/^\d{4}$/.test(res)) res = res.slice(0, 2) + ":" + res.slice(2);
            // Handle "10"
            if (/^\d{1,2}$/.test(res)) res = res + ":00";

            let hours, mins, ampm;
            // Match H, HH, H:MM, HH:MM followed by optional AM/PM
            const match = res.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
            if (!match) return null;

            hours = parseInt(match[1]);
            mins = match[2] || "00";
            ampm = match[3];

            // Logic for military time (if no am/pm specified and hours >= 12, it's PM)
            if (!ampm) {
                if (hours >= 12) {
                    ampm = "pm";
                    if (hours > 12) hours -= 12;
                } else {
                    ampm = "am";
                    if (hours === 0) hours = 12;
                }
            } else {
                // Correct 12 AM/PM
                if (hours > 12) hours %= 12;
                if (hours === 0) hours = 12;
            }

            return `${String(hours).padStart(2, '0')}:${mins} ${ampm.toUpperCase()}`;
        }

        window.login = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (email !== ADMIN_EMAIL) return alert("Access Denied.");
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert("Login failed. Check password."); }
        };

        window.logout = () => signOut(auth);
        window.scrollToSection = (id) => document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                initData();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('adminDashboard').classList.add('hidden');
            }
        });

        function initData() {
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'availability');
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentWeeklySchedule = data.weeklySchedule || {};
                    currentBlackouts = data.blackoutDates || [];
                    renderWeeklyEditor();
                    renderBlackoutCalendar();
                } else {
                    setDoc(settingsRef, { 
                        weeklySchedule: {0:{slots:[], disabled:true}, 1:{slots:["09:00 AM"], disabled:false}, 2:{slots:["09:00 AM"], disabled:false}, 3:{slots:["09:00 AM"], disabled:false}, 4:{slots:["09:00 AM"], disabled:false}, 5:{slots:["09:00 AM"], disabled:false}, 6:{slots:[], disabled:true}}, 
                        blackoutDates: [] 
                    });
                }
            });

            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'bookings')), (snapshot) => {
                renderBookingsTable(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
            });
        }

        function renderWeeklyEditor() {
            const container = document.getElementById('weeklyScheduleContainer');
            container.innerHTML = '';
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

            days.forEach((dayName, index) => {
                const dayData = currentWeeklySchedule[index] || { slots: [], disabled: false };
                const row = document.createElement('div');
                row.className = `p-4 rounded-xl border transition ${dayData.disabled ? 'bg-red-50 border-red-100' : 'bg-slate-50 border-slate-100'}`;
                
                row.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="w-24 shrink-0 font-bold text-sm text-slate-700">${dayName}</div>
                        <div class="flex-1 flex flex-wrap gap-2">
                            ${dayData.slots.map(slot => `
                                <div class="bg-white px-2 py-1 rounded border border-slate-200 text-xs font-bold flex items-center gap-1 shadow-sm">
                                    ${slot}
                                    <button onclick="removeWeeklyTime(${index}, '${slot}')" class="text-slate-300 hover:text-red-500 transition"><i data-lucide="x-circle" class="w-3 h-3"></i></button>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex gap-2">
                            ${!dayData.disabled ? `
                                <div class="flex bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm focus-within:ring-2 focus-within:ring-indigo-500 transition">
                                    <input id="input-${index}" type="text" placeholder="e.g. 14:00" class="w-20 px-2 py-1 text-xs outline-none" onkeydown="if(event.key === 'Enter') addWeeklyTime(${index})">
                                    <button onclick="addWeeklyTime(${index})" class="px-3 bg-indigo-600 text-white text-[10px] font-bold hover:bg-indigo-700 transition">ADD</button>
                                </div>
                            ` : ''}
                            <button onclick="toggleDayAvailability(${index})" class="px-3 py-1 text-[10px] font-bold rounded-lg border bg-white shadow-sm transition ${dayData.disabled ? 'text-green-600 border-green-200 hover:bg-green-50' : 'text-red-600 border-red-200 hover:bg-red-50'}">
                                ${dayData.disabled ? 'ENABLE' : 'DISABLE DAY'}
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
            lucide.createIcons();
        }

        window.toggleDayAvailability = async (index) => {
            const updated = {...currentWeeklySchedule};
            if (!updated[index]) updated[index] = { slots: [], disabled: false };
            updated[index].disabled = !updated[index].disabled;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'availability'), { weeklySchedule: updated });
        }

        window.addWeeklyTime = async (index) => {
            const input = document.getElementById(`input-${index}`);
            const formatted = standardizeTime(input.value);
            
            if (!formatted) {
                input.classList.add('ring-2', 'ring-red-400');
                setTimeout(() => input.classList.remove('ring-2', 'ring-red-400'), 1000);
                return;
            }

            const updated = {...currentWeeklySchedule};
            if (!updated[index]) updated[index] = { slots: [], disabled: false };
            
            if (!updated[index].slots.includes(formatted)) {
                updated[index].slots.push(formatted);
                updated[index].slots.sort((a, b) => {
                    return new Date('1970/01/01 ' + a) - new Date('1970/01/01 ' + b);
                });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'availability'), { weeklySchedule: updated });
            }
            input.value = '';
            input.focus();
        };

        window.removeWeeklyTime = async (index, time) => {
            const updated = {...currentWeeklySchedule};
            if (updated[index] && updated[index].slots) {
                updated[index].slots = updated[index].slots.filter(t => t !== time);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'availability'), { weeklySchedule: updated });
            }
        };

        function renderBlackoutCalendar() {
            const grid = document.getElementById('adminCalGrid');
            grid.innerHTML = '';
            const firstDay = new Date(adminCalYear, adminCalMonth, 1).getDay();
            const daysInMonth = new Date(adminCalYear, adminCalMonth + 1, 0).getDate();
            document.getElementById('adminCalMonth').innerText = `${new Intl.DateTimeFormat('en-US', { month: 'long' }).format(new Date(adminCalYear, adminCalMonth))} ${adminCalYear}`;
            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${adminCalYear}-${String(adminCalMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const box = document.createElement('div');
                box.className = `day-box ${currentBlackouts.includes(dateStr) ? 'blackout' : ''}`;
                box.innerText = i;
                box.onclick = async () => {
                    let updated = currentBlackouts.includes(dateStr) ? currentBlackouts.filter(d => d !== dateStr) : [...currentBlackouts, dateStr];
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'availability'), { blackoutDates: updated });
                };
                grid.appendChild(box);
            }
        }

        function renderBookingsTable(data) {
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            data.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)).forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><div class="font-bold text-xs text-slate-900">${item.scheduledDate}</div><div class="text-[10px] text-slate-500">${item.scheduledTime}</div></td>
                    <td><div class="text-xs font-bold text-slate-700">${item.studentFirstName} ${item.studentLastName}</div><div class="text-[10px] text-indigo-500">${item.studentEmail}</div></td>
                    <td class="text-[10px] font-bold uppercase text-slate-500">${item.course}</td>
                    <td class="text-[10px] text-slate-400 font-bold uppercase">${item.location}</td>
                    <td><span class="status-badge ${item.status === 'confirmed' ? 'bg-green-100 text-green-700' : item.status === 'cancelled' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">${item.status.toUpperCase()}</span></td>
                    <td class="text-right">
                        <div class="flex justify-end gap-1">
                            <button onclick="updateStatus('${item.id}', 'confirmed')" class="btn-action border-green-200 text-green-600 hover:bg-green-600 hover:text-white">Approve</button>
                            <button onclick="updateStatus('${item.id}', 'cancelled')" class="btn-action border-red-200 text-red-600 hover:bg-red-600 hover:text-white">Deny</button>
                            <button onclick="deleteRow('${item.id}')" class="p-2 text-slate-300 hover:text-red-500 transition" title="Delete Record"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>`;
                body.appendChild(tr);
            });
            lucide.createIcons();
        }

        window.updateStatus = async (id, status) => { 
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id), { status }); 
            } catch (e) { console.error("Update failed", e); }
        };
        
        window.deleteRow = async (id) => { 
            if (confirm("Permanently delete this record? This cannot be undone.")) {
                try {
                    // Force the path to be absolute within the artifact structure
                    const targetDoc = doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id);
                    await deleteDoc(targetDoc);
                } catch (e) {
                    console.error("Delete operation failed:", e);
                    alert("Delete failed. This may be due to a sync delay. Please try again in a moment.");
                }
            }
        };
        
        window.changeAdminCal = (dir) => { adminCalMonth += dir; if(adminCalMonth>11){adminCalMonth=0; adminCalYear++} if(adminCalMonth<0){adminCalMonth=11; adminCalYear--} renderBlackoutCalendar(); };

    </script>
</body>
</html>
